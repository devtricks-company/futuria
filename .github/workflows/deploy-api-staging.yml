# Build the API image, publish it to GitHub's container registry (public, like this repo) and roll
# it out to the staging Container App on Azure. Setup and the one-time Azure steps: docs/DEPLOY.md.
#
# Until the repo variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID exist, the
# workflow only publishes the image. It also skips the rollout while the Container App
# (AZURE_CONTAINER_APP in AZURE_RESOURCE_GROUP) doesn't exist yet.
name: Deploy API (staging)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/deploy-api-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push the image to ghcr.io
  id-token: write # sign in to Azure with OIDC (no stored password)

concurrency:
  group: deploy-api-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/futuria-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        if: vars.AZURE_CLIENT_ID != ''
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          if az containerapp show -n "$APP" -g "$RG" --output none 2>/dev/null; then
            az containerapp update -n "$APP" -g "$RG" --image "$IMAGE:$GITHUB_SHA" --output none
            echo "Rolled out $IMAGE:$GITHUB_SHA to $APP."
          else
            echo "Container App $APP not found in $RG: image published only."
          fi
