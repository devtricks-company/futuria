# Optional local MongoDB, for offline work or fast e2e tests. The app normally uses MongoDB Atlas.
#   docker compose up -d
# Then set MONGODB_URI=mongodb://localhost:27017/futuria in apps/api/.env (or leave
# MONGODB_TEST_URI unset, and the e2e tests use it).
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
